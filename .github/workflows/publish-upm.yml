name: Publish Unity Package Manager branches

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Native meshing libraries run containing the reviewed Unity packages
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: fidget-upm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          if run['conclusion'] != 'success' or run['path'] != '.github/workflows/native.yml':
              sys.exit('Choose a successful native.yml run from this repository')
          print(f"Publishing packages built from {run['head_sha']}")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: fidget-unity-packages
          path: target/upm-publication
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish complete packages
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.run_id }}
        run: |
          gh auth setup-git
          python3 unity/publish_upm.py \
            --artifacts target/upm-publication \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$PACKAGE_RUN" \
            --work-dir "$RUNNER_TEMP/fidget-upm-publication"
